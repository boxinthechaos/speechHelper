<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 팩폭 면접관</title>
    <link rel="stylesheet" href="/css/interview/interview.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <script src="/js/interview/interview.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="bg-shape shape1"></div>
<div class="bg-shape shape2"></div>
<div class="bg-shape shape3"></div>

<div class="page-wrapper">

    <header class="page-header">
        <h2>🤖 AI 팩폭 면접관</h2>
        <p class="page-subtitle">AI 면접관에게 직접 피드백을 받아보세요</p>
    </header>

    <section class="section">

        <div id="categoryView">
            <div class="section-title">
                <span class="section-icon">🗂️</span>
                면접 분야 선택
                <span class="section-hint">원하는 분야를 클릭하세요</span>
            </div>
            <div id="categoryCards" class="card-grid">
                <div class="card-loader">
                    <div class="spinner"></div>
                    질문 족보를 불러오는 중입니다... ⏳
                </div>
            </div>
        </div>

        <div id="questionView" style="display: none;">
            <div class="section-title">
                <button class="btn-back" onclick="goBackToCategories()">⬅️ 뒤로가기</button>
                <span id="currentCategoryTitle" style="margin-left: 8px;">질문 리스트</span>
            </div>
            <div id="questionCards" class="card-grid"></div>
        </div>

    </section>

    <section id="answerSection" class="box answer-box" style="display: none;">
        <h3 id="selectedQuestionTitle" class="selected-question">질문을 선택해주세요.</h3>
        <label for="answer">🗣️ 내 답변</label>
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <button class="btn btn-mic" id="micBtn" onclick="toggleSTT()">🎤 말하기</button>
            <span id="micStatus" style="font-size: 0.85em; color: #64748b; align-self: center;"></span>
        </div>
        <textarea id="answer" rows="5" placeholder="당신의 논리를 펼쳐보세요..."></textarea>
        <button class="btn btn-submit" onclick="getFeedback()">팩폭 맞기 🥊</button>
    </section>

</div>

<div id="feedbackModal" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-panel">
        <div id="modalLoading" class="modal-loading">
            <div class="modal-characters">
                <div class="upper-layer">
                    <div class="block black"><div class="eye left"><div class="pupil"></div></div><div class="eye right"><div class="pupil"></div></div></div>
                    <div class="block silver"><div class="eye left"><div class="pupil"></div></div><div class="eye right"><div class="pupil"></div></div></div>
                </div>
                <div class="lower-layer">
                    <div class="block lime"><div class="eye left"><div class="pupil"></div></div><div class="eye right"><div class="pupil"></div></div></div>
                    <div class="block red"><div class="eye left"><div class="pupil"></div></div><div class="eye right"><div class="pupil"></div></div></div>
                    <div class="block yellow"><div class="eye left"><div class="pupil"></div></div><div class="eye right"><div class="pupil"></div></div></div>
                </div>
            </div>
            <p class="loading-text" id="loadingText">면접관들이 답변을 검토 중입니다...</p>
            <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>

        <div id="modalResult" class="modal-result" style="display:none;">
            <div class="modal-result-header">
                <h3 class="modal-result-title">💬 면접관의 피드백</h3>
                <button class="modal-close-btn" onclick="closeModal()">✕</button>
            </div>
            <div id="modalFeedbackText" class="modal-feedback-text"></div>
            <div class="modal-tts-buttons">
                <button class="btn btn-tts" onclick="playTTS()">🔊 음성으로 듣기</button>
                <button class="btn btn-stop" onclick="stopTTS()">🔇 멈추기</button>
                <button class="btn btn-close-modal" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

</body>
</html>
