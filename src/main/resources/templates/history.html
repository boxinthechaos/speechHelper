<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 팩폭 면접관</title>
    <link rel="stylesheet" href="/css/interview/history.css">
    <link rel="stylesheet" href="/css/common/common.css">
    <script src="/js/common/common.js" defer></script>
    <script src="/js/interview/history.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="bg-shape shape1"></div>
<div class="bg-shape shape2"></div>
<div class="bg-shape shape3"></div>

<div class="page-wrapper">
    <header class="page-header">
        <h2>📜 나의 팩폭 기록장</h2>
        <p class="page-subtitle">과거의 뼈아픈 조언들을 다시 복습해보세요</p>
    </header>

    <section class="box">
        <!-- 탭 헤더 -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabInterview" onclick="switchTab('interview')">
                🎤 면접 기록
            </button>
            <button class="tab-btn" id="tabPortfolio" onclick="switchTab('portfolio')">
                🗂️ 포트폴리오 첨삭
            </button>
        </div>

        <!-- 면접 기록 탭 -->
        <div id="panelInterview">
            <div class="history-header-bar">
                <span class="section-title">면접 기록</span>
                <span class="history-count" id="historyCount">0개</span>
            </div>
            <div id="historyContainer">
                <div class="card-loader">
                    <div class="spinner"></div>
                    기록을 불러오는 중입니다... ⏳
                </div>
            </div>
        </div>

        <!-- 포트폴리오 첨삭 탭 -->
        <div id="panelPortfolio" style="display:none;">
            <div class="history-header-bar">
                <span class="section-title">포트폴리오 첨삭 기록</span>
                <span class="history-count" id="portfolioCount">0개</span>
            </div>
            <div id="portfolioContainer">
                <div class="card-loader">
                    <div class="spinner"></div>
                    기록을 불러오는 중입니다... ⏳
                </div>
            </div>
        </div>
    </section>
</div>

<div id="toast" class="toast"></div>

</body>
</html>
