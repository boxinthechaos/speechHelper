<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 팩폭 면접관 - 회원가입</title>
    <link rel="stylesheet" href="/css/signup/signup.css">
    <script src="/js/signup/signup.js" defer></script>
</head>
<body>

<div class="bg-shape shape1"></div>
<div class="bg-shape shape2"></div>
<div class="bg-shape shape3"></div>

<div class="wrapper">
    <div class="signup-panel">

        <!-- 왼쪽: 캐릭터 사이드 -->
        <div class="character-side">
            <div class="character-group">
                <div class="upper-layer">
                    <div class="block black">
                        <div class="eye left"><div class="pupil"></div></div>
                        <div class="eye right"><div class="pupil"></div></div>
                    </div>
                    <div class="block silver">
                        <div class="eye left"><div class="pupil"></div></div>
                        <div class="eye right"><div class="pupil"></div></div>
                    </div>
                </div>
                <div class="lower-layer">
                    <div class="block lime">
                        <div class="eye left"><div class="pupil"></div></div>
                        <div class="eye right"><div class="pupil"></div></div>
                    </div>
                    <div class="block red">
                        <div class="eye left"><div class="pupil"></div></div>
                        <div class="eye right"><div class="pupil"></div></div>
                    </div>
                    <div class="block yellow">
                        <div class="eye left"><div class="pupil"></div></div>
                        <div class="eye right"><div class="pupil"></div></div>
                    </div>
                </div>
            </div>

            <div class="character-text">
                <h3>새로운 도전자 등장!</h3>
                <p>AI 면접관들이 당신을 환영합니다</p>
            </div>

            <!-- 스텝 인디케이터 -->
            <div class="step-indicator">
                <div class="step active" id="step-dot-1">
                    <div class="step-dot"></div>
                    <span>계정 정보</span>
                </div>
                <div class="step-line"></div>
                <div class="step" id="step-dot-2">
                    <div class="step-dot"></div>
                    <span>완료</span>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 폼 사이드 -->
        <div class="form-side">
            <h2>회원가입</h2>

            <div class="input-group">
                <label class="input-label">이름</label>
                <input type="text" id="name" class="input-field" placeholder="홍길동" required>
                <span class="field-hint" id="hint-name"></span>
            </div>

            <div class="input-group">
                <label class="input-label">이메일</label>
                <input type="email" id="email" class="input-field" placeholder="example@email.com" required>
                <span class="field-hint" id="hint-email"></span>
            </div>

            <div class="input-group">
                <label class="input-label">비밀번호</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="input-field" placeholder="8자 이상 입력해주세요" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">
                        <!-- eye icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <!-- 비밀번호 강도 바 -->
                <div class="strength-bar-wrapper" id="strength-bar-wrapper">
                    <div class="strength-bar" id="strength-bar"></div>
                </div>
                <span class="field-hint" id="hint-password"></span>
            </div>

            <div class="input-group">
                <label class="input-label">비밀번호 확인</label>
                <div class="password-wrapper">
                    <input type="password" id="password-confirm" class="input-field" placeholder="비밀번호를 다시 입력해주세요" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword('password-confirm', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <span class="field-hint" id="hint-confirm"></span>
            </div>

            <button class="btn-signup" onclick="signUp()">가입하기</button>

            <div class="login-link">
                이미 계정이 있으신가요? <a href="/api/v1/auth/loginP">로그인 하기</a>
            </div>
        </div>

    </div>
</div>

<div id="toast" class="toast">알림 메시지</div>

</body>
</html>
